name: Build
on:
  workflow_dispatch:
    inputs:
      windows:
        description: Windows (installer + raw)
        type: boolean
        default: true
      android_arm32:
        description: Android APK (armeabi-v7a, 32-bit)
        type: boolean
        default: true
      android_arm64:
        description: Android APK (arm64-v8a, 64-bit)
        type: boolean
        default: true
      android_universal:
        description: Android APK (universal, все ABI)
        type: boolean
        default: true
      linux_tarball:
        description: Linux (bundle.tar.gz)
        type: boolean
        default: true
      linux_appimage:
        description: Linux AppImage
        type: boolean
        default: true
jobs:
  build-windows:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    steps:
      - name: Checkout Extera
        uses: actions/checkout@v4
        with:
          path: Extera

      - name: Checkout matrix-dart-sdk
        uses: actions/checkout@v4
        with:
          repository: ExteraApp/matrix-dart-sdk
          ref: main
          path: matrix-dart-sdk

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake, NASM, OpenSSL via Chocolatey
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install nasm -y
          choco install openssl -y
        shell: pwsh

      - name: Add tools to PATH
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Run Windows build script
        working-directory: Extera
        run: .\scripts\build-windows.ps1
        shell: pwsh

      - name: Verify build output exists
        working-directory: Extera
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\extera.exe"
          if (-not (Test-Path $exe)) {
            throw "Build failed: $exe not found"
          }
          Write-Host "Found: $exe"

      - name: Generate Inno Setup script
        working-directory: Extera
        shell: pwsh
        run: |
          @'
          #define MyAppName "Extera"
          #define MyAppExe "extera.exe"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Extera"

          [Setup]
          AppId={{B6A6E5C0-EXTR-4A11-9C3E-000000000001}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=Output
          OutputBaseFilename=Extera-Setup-{#MyAppVersion}
          Compression=lzma2/max
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExe}

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExe}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Создать значок на рабочем столе"; GroupDescription: "Дополнительно"

          [Run]
          Filename: "{app}\{#MyAppExe}"; Description: "Запустить {#MyAppName}"; Flags: nowait postinstall skipifsilent
          '@ | Out-File -FilePath extera.iss -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build installer
        working-directory: Extera
        run: iscc extera.iss
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: extera-windows-setup
          path: Extera/Output/*.exe

      - name: Upload raw build (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: extera-windows-raw
          path: Extera/build/windows/x64/runner/Release/**

  build-android:
    if: ${{ inputs.android_arm32 || inputs.android_arm64 || inputs.android_universal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm32
            target: android-arm
            artifact-suffix: armeabi-v7a
            enabled-input: android_arm32
          - arch: arm64
            target: android-arm64
            artifact-suffix: arm64-v8a
            enabled-input: android_arm64
          - arch: universal
            target: android-arm,android-arm64,android-x64
            artifact-suffix: universal
            enabled-input: android_universal
    steps:
      - name: Skip if not requested
        if: ${{ !inputs[matrix.enabled-input] }}
        run: echo "Skipping ${{ matrix.arch }} — input '${{ matrix.enabled-input }}' is false" && exit 0

      - name: Checkout Extera
        if: ${{ inputs[matrix.enabled-input] }}
        uses: actions/checkout@v4
        with:
          path: Extera

      - name: Checkout matrix-dart-sdk
        if: ${{ inputs[matrix.enabled-input] }}
        uses: actions/checkout@v4
        with:
          repository: ExteraApp/matrix-dart-sdk
          ref: main
          path: matrix-dart-sdk

      - name: Set up JDK 17
        if: ${{ inputs[matrix.enabled-input] }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: ${{ inputs[matrix.enabled-input] }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        if: ${{ inputs[matrix.enabled-input] }}
        working-directory: Extera
        run: flutter pub get

      - name: Build APK (${{ matrix.arch }})
        if: ${{ inputs[matrix.enabled-input] }}
        working-directory: Extera
        run: |
          if [ "${{ matrix.arch }}" = "universal" ]; then
            flutter build apk --release --target-platform ${{ matrix.target }}
          else
            flutter build apk --release --target-platform ${{ matrix.target }} --split-per-abi
          fi

      - name: Upload APK
        if: ${{ inputs[matrix.enabled-input] }}
        uses: actions/upload-artifact@v4
        with:
          name: extera-android-${{ matrix.artifact-suffix }}
          path: Extera/build/app/outputs/flutter-apk/*.apk

  build-linux:
    if: ${{ inputs.linux_tarball || inputs.linux_appimage }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Extera
        uses: actions/checkout@v4
        with:
          path: Extera

      - name: Checkout matrix-dart-sdk
        uses: actions/checkout@v4
        with:
          repository: ExteraApp/matrix-dart-sdk
          ref: main
          path: matrix-dart-sdk

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libmpv-dev mpv \
            libolm3 file fuse

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: Extera
        run: flutter pub get

      - name: Build Linux release
        working-directory: Extera
        run: flutter build linux --release

      - name: Package Linux bundle (tar.gz)
        if: ${{ inputs.linux_tarball }}
        working-directory: Extera
        run: bash scripts/build-linux.sh

      - name: Upload Linux tar.gz
        if: ${{ inputs.linux_tarball }}
        uses: actions/upload-artifact@v4
        with:
          name: extera-linux-x64
          path: Extera/build/linux/x64/release/bundle.tar.gz

      - name: Download appimagetool
        if: ${{ inputs.linux_appimage }}
        run: |
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        if: ${{ inputs.linux_appimage }}
        working-directory: Extera
        run: |
          # appimagetool requires FUSE; on GitHub runners use --appimage-extract-and-run
          mkdir -p appimage/Extera.AppDir
          cp -r build/linux/x64/release/bundle/* appimage/Extera.AppDir/
          cp appimage/Extera.desktop appimage/Extera.AppDir/
          mkdir -p appimage/Extera.AppDir/usr/share/icons
          cp assets/logo.svg appimage/Extera.AppDir/extera.svg
          cp appimage/AppRun appimage/Extera.AppDir/
          cd appimage
          appimagetool --appimage-extract-and-run Extera.AppDir

      - name: Upload AppImage
        if: ${{ inputs.linux_appimage }}
        uses: actions/upload-artifact@v4
        with:
          name: extera-linux-appimage
          path: Extera/appimage/*.AppImage
